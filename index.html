<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Akshay 🦇</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;

  /* 🌆 OUTSIDE background */
  background: url('https://share.google/2DoCXQoGbksgHg3ch') no-repeat center/cover;
}

/* Dark overlay */
body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 0;
}

/* 🟡 Card with INNER background */
.card {
  position: relative;
  z-index: 2;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  width: 360px;

  /* 🖼️ INSIDE background */
  background: url('https://share.google/cdGri5Wgaug82bu3a') no-repeat center/cover;

  /* Glow */
  box-shadow: 0 0 20px #ffdd00,
              0 0 40px #ffdd00,
              0 0 60px rgba(255,221,0,0.5);
}

/* Overlay inside card for readability */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
  border-radius: 20px;
  z-index: -1;
}

/* Title */
h1 {
  color: #ffdd00;
  text-shadow: 0 0 10px #ffdd00;
}

/* Button */
button {
  margin-top: 20px;
  padding: 12px 20px;
  border-radius: 25px;
  border: none;
  background: #ffdd00;
  color: black;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 15px #ffdd00;
}

/* Message box */
#message {
  margin-top: 20px;
  font-size: 16px;
  color: #fff;
  display: none;
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<!-- 🎵 Music -->
<audio id="music" loop>
  <source src="https://www2.cs.uic.edu/~i101/SoundFiles/HappyBirthday.mid" type="audio/midi">
</audio>

<div class="card">

  <h1>Happy Birthday Akshay 🖤</h1>

  <p>
    High above Gotham,<br>
    a legend watches the city 🦇
  </p>

  <button onclick="showMessage()">
    Turn On Bat Signal 🎵
  </button>

  <!-- 💬 Hidden message -->
  <div id="message">
    🎉 Happy Birthday Akshay! 🎉<br><br>
    May your life be as powerful as Batman,<br>
    as fearless as the night,<br>
    and as bright as the Bat Signal 🦇✨
  </div>

</div>

<script>
function showMessage() {
  document.getElementById("music").play();
  document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
