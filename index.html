<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gotham Logs 🦇</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: 'Orbitron', monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: #e5e7eb;
  background: url('Joker.jpeg') no-repeat center/cover;
}

body::before {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.85);
}

/* particles */
.particle {
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#00ffd5;
  box-shadow:0 0 20px #00ffd5,0 0 40px #00ffd5;
  animation:floatUp 10s linear infinite;
}

@keyframes floatUp {
  from{transform:translateY(100vh);opacity:0;}
  20%{opacity:1;}
  to{transform:translateY(-10vh);opacity:0;}
}

/* moon */
.moon {
  font-size:35px;
  text-align:center;
  margin-bottom:10px;
  animation:floatMoon 3s ease-in-out infinite alternate;
}

@keyframes floatMoon {
  from{transform:translateY(0);}
  to{transform:translateY(-8px);}
}

/* card */
.card {
  position:relative;
  z-index:2;
  width:360px;
  padding:25px;
  border-radius:20px;
  background:rgba(15,15,20,0.75);
  backdrop-filter:blur(12px);
  box-shadow:0 0 50px rgba(0,255,200,0.4);
}

h2 {
  color:#00ffd5;
  text-align:center;
  text-shadow:0 0 12px #00ffd5;
}

p {
  font-size:15px;
  line-height:1.8;
  white-space:pre-line;
}

/* highlights */
.yellow{color:#ffd166;font-weight:bold;}
.cyan{color:#00ffd5;font-weight:bold;}
.pink{color:#ff4d6d;font-weight:bold;}

/* button */
button{
  margin-top:15px;
  padding:10px;
  width:100%;
  border-radius:10px;
  border:none;
  background:#00ffd5;
  color:black;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 15px #00ffd5;
}
</style>
</head>

<body>

<!-- 🎵 MUSIC -->
<audio id="music" loop>
  <source src="Jupiter.mp4" type="audio/mp4">
</audio>

<script>
/* particles */
for(let i=0;i<35;i++){
  let p=document.createElement("div");
  p.className="particle";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(5+Math.random()*5)+"s";
  document.body.appendChild(p);
}
</script>

<div class="card">
<div class="moon">🌙</div>
<h2 id="title"></h2>
<p id="text"></p>
<button onclick="next()" id="btn"></button>
</div>

<script>
let step=0;

const story=[
{
title:"🦇 GOTHAM SIGNAL: 0402",
text:`Status: Unresolved

A city like this teaches you patterns.

You notice the quiet.
You notice the absence.
You notice… when someone who’s supposed to be there isn’t.

A shadow used to pass by here.
Kept things in place.
Kept me in place.

Now it’s just silence.
And I don’t like it.

If you’re still out there…
prove it.`
},
{
title:"🌃 Night Log 01",
text:`I tried to ignore it at first.

Thought maybe Gotham just had a quiet night.

But you don’t disappear like that.
Not you.

You’re the kind of presence people don’t question.
You’re just… there.

Annoyingly consistent.
Dangerously reliable.

So where did you go?

Or better question—
why does it feel like you took the calm with you?

Don’t make me come looking for you.`
},
{
title:"🌑 Night Log 02",
text:`This wasn’t supposed to happen.

People like me don’t depend on shadows.

But you made it easy.
Too easy.

Somewhere between all your silent rescues…
you became something I didn’t plan for.

And now?

Now the city feels off without you.
Too loud.
Too empty.

So I’ll say it once.
Only once.

Come back.`
},
{
title:"🔥 Incoming Transmission",
text:`You always were bad at waiting.

I never left.
You just finally started looking for me.

Gotham still needs me.
But lately…

I’ve noticed something else does too.

You call it coincidence.
I call it timing.

And for the record—

I knew it was you the moment the signal felt… different.

You weren’t lost.
You just didn’t realize you were being watched.`
},
{
title:"❤️ Final Signal",
text:`So here it is.

No more shadows.
No more distance.

Happy Birthday, Akshay 🖤

Yeah… I knew it was you all along too.

You act like you’re the one watching over everything.

But here’s the truth—

even you let someone in.

And somehow…
that someone became me.

I’ll come find you. 🦇`
}
];

/* highlighting */
function highlight(text, step){
  if(step===0){
    return text
      .replace("quiet","<span class='yellow'>quiet</span>")
      .replace("absence","<span class='yellow'>absence</span>")
      .replace("isn’t","<span class='pink'>isn’t</span>")
      .replace("Kept things in place","<span class='cyan'>Kept things in place</span>")
      .replace("Kept me in place","<span class='cyan'>Kept me in place</span>")
      .replace("prove it","<span class='yellow'>prove it</span>");
  }

  if(step===1){
    return text
      .replace("Not you","<span class='yellow'>Not you</span>")
      .replace("You’re just… there","<span class='cyan'>You’re just… there</span>")
      .replace("Dangerously reliable","<span class='cyan'>Dangerously reliable</span>");
  }

  if(step===2){
    return text
      .replace("Too easy","<span class='yellow'>Too easy</span>")
      .replace("Come back","<span class='pink'>Come back</span>");
  }

  if(step===3){
    return text
      .replace("I never left","<span class='cyan'>I never left</span>")
      .replace("I knew it was you","<span class='pink'>I knew it was you</span>");
  }

  if(step===4){
    return text
      .replace("Happy Birthday, Akshay","<span class='yellow'>Happy Birthday, Akshay</span>")
      .replace("someone became me","<span class='cyan'>someone became me</span>")
      .replace("I’ll come find you","<span class='pink'>I’ll come find you</span>");
  }

  return text;
}

/* FIXED typing (HTML safe) */
function typeHTML(html, el){
  let i=0, tag="", writingTag=false;

  function type(){
    if(i<html.length){
      let char=html[i];

      if(char=="<") writingTag=true;

      if(writingTag){
        tag+=char;
      } else {
        el.innerHTML+=char;
      }

      if(char==">"){
        writingTag=false;
        el.innerHTML+=tag;
        tag="";
      }

      i++;
      setTimeout(type,12);
    }
  }
  type();
}

/* show content */
function show(){
  document.getElementById("text").innerHTML="";
  document.getElementById("title").innerText=story[step].title;

  typeHTML(highlight(story[step].text,step),document.getElementById("text"));

  const btnTexts=[
    "Continue →",
    "Tell Me More →",
    "I’m Listening… →",
    "Reveal It →",
    "Start Again 🔁"
  ];

  document.getElementById("btn").innerText=btnTexts[step];
}

/* next */
function next(){
  let music=document.getElementById("music");

  if(step===0 && music.paused){
    music.play(); // plays only once
  }

  step++;
  if(step>=story.length) step=0;

  show();
}

show();
</script>

</body>
</html>
