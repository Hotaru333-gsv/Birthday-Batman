<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Naruto Birthday — Draksmer Augustin 🍥</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Noto+Sans+JP:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>

:root{
  --orange:#FF6B00;
  --yellow:#FFD700;
  --white:#fff8f0;
  --dark:#050505;
  --chakra:#4FC3F7;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:black;
  color:white;
  font-family:'Noto Sans JP',sans-serif;
  position:relative;
}

/* BACKGROUND */

body::before{
  content:"";
  position:absolute;
  inset:0;

  background:
  radial-gradient(circle at center,
  rgba(255,107,0,.12),
  transparent 60%),

  linear-gradient(rgba(0,0,0,.75),
  rgba(0,0,0,.92)),

  url('naruto.jpg') center/cover no-repeat;

  z-index:-5;
}

/* STARS */

.star{
  position:absolute;
  background:white;
  border-radius:50%;
  animation:twinkle var(--dur) ease-in-out infinite;
}

@keyframes twinkle{

  0%,100%{
    opacity:.1;
  }

  50%{
    opacity:1;
  }
}

/* FLOATING LIGHTS */

.light{
  position:absolute;
  border-radius:50%;
  animation:float linear infinite;
  opacity:.9;
}

.blue{
  background:#35d9ff;

  box-shadow:
  0 0 8px #35d9ff,
  0 0 20px #35d9ff;
}

.orangeLight{
  background:#ff6b00;

  box-shadow:
  0 0 10px #ff6b00,
  0 0 25px #ff6b00;
}

@keyframes float{

  from{
    transform:
    translateY(100vh)
    scale(.5);

    opacity:0;
  }

  20%{
    opacity:1;
  }

  to{
    transform:
    translateY(-20vh)
    scale(1.2);

    opacity:0;
  }
}

/* HERO */

.hero{
  width:100%;
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;

  position:relative;

  z-index:2;

  text-align:center;

  padding:20px;
}

/* SUN */

.sun{
  position:absolute;

  width:240px;
  height:240px;

  border-radius:50%;

  background:
  radial-gradient(circle,
  rgba(255,215,0,.95) 0%,
  rgba(255,140,0,.45) 45%,
  rgba(255,80,0,0) 75%);

  filter:blur(2px);

  z-index:-1;

  animation:sunRise 3s ease-out forwards;

  opacity:0;
}

@keyframes sunRise{

  from{
    transform:
    translateY(60px);

    opacity:0;
  }

  to{
    transform:
    translateY(0);

    opacity:1;
  }
}

/* HEADBAND */

.headband{
  display:flex;
  align-items:center;
  gap:18px;

  margin-bottom:28px;

  animation:fadeUp 1s ease forwards;
}

.line{
  width:90px;
  height:1px;

  background:
  linear-gradient(
  90deg,
  transparent,
  var(--orange));
}

.line.right{

  background:
  linear-gradient(
  90deg,
  var(--orange),
  transparent);
}

.plate{
  padding:8px 22px;

  background:#9b9b9b;

  border:2px solid #c5c5c5;

  border-radius:4px;

  color:black;

  font-size:11px;

  letter-spacing:4px;

  font-weight:700;

  position:relative;

  overflow:hidden;
}

.plate::after{
  content:"";

  position:absolute;
  inset:0;

  background:
  linear-gradient(
  135deg,
  rgba(255,255,255,.45),
  transparent 60%);
}

/* PRE TITLE */

.pre{
  font-size:11px;

  letter-spacing:9px;

  color:rgba(255,107,0,.7);

  margin-bottom:15px;

  opacity:0;

  animation:fadeUp 1s ease .4s forwards;
}

/* MAIN TITLE */

.title{
  font-family:'Cinzel Decorative',serif;

  font-size:clamp(55px,10vw,120px);

  line-height:.9;

  font-weight:900;

  color:white;

  opacity:0;

  animation:titleReveal 1.2s ease .8s forwards;

  text-shadow:
  0 0 30px rgba(255,107,0,.35),
  0 0 70px rgba(255,107,0,.15);
}

.orange{
  color:var(--orange);

  text-shadow:
  0 0 35px rgba(255,107,0,.7),
  0 0 80px rgba(255,107,0,.3);
}

/* JAPANESE */

.jp{
  margin-top:24px;

  font-size:20px;

  letter-spacing:12px;

  color:rgba(255,255,255,.45);

  opacity:0;

  animation:fadeUp 1s ease 1.5s forwards;
}

/* NAME */

.name{
  margin-top:35px;

  font-family:'Cinzel Decorative',serif;

  font-size:clamp(30px,6vw,58px);

  color:var(--yellow);

  text-shadow:
  0 0 20px rgba(255,215,0,.5);

  opacity:0;

  animation:fadeUp 1s ease 2s forwards;
}

/* TAGLINE */

.tag{
  margin-top:16px;

  font-size:15px;

  color:rgba(255,255,255,.65);

  letter-spacing:3px;

  font-style:italic;

  opacity:0;

  animation:fadeUp 1s ease 2.5s forwards;
}

/* BUTTON */

.btn{
  margin-top:45px;

  border:1px solid var(--orange);

  background:transparent;

  color:var(--orange);

  padding:15px 42px;

  font-family:'Cinzel Decorative',serif;

  letter-spacing:4px;

  cursor:pointer;

  position:relative;

  overflow:hidden;

  transition:.4s;

  opacity:0;

  animation:fadeUp 1s ease 3s forwards;
}

.btn::before{
  content:"";

  position:absolute;
  inset:0;

  background:var(--orange);

  transform:translateX(-101%);

  transition:.4s;
}

.btn:hover::before{
  transform:translateX(0);
}

.btn span{
  position:relative;
  z-index:2;
}

.btn:hover{
  color:black;
}

/* SCROLL */

.scroll{
  position:absolute;

  bottom:30px;
  left:50%;

  transform:translateX(-50%);

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:6px;

  opacity:0;

  animation:fadeUp 1s ease 4s forwards;
}

.scroll span{
  font-size:10px;

  letter-spacing:4px;

  color:rgba(255,255,255,.3);
}

.mouse{
  width:16px;
  height:24px;

  border:1px solid rgba(255,107,0,.4);

  border-radius:10px;

  position:relative;
}

.mouse::after{
  content:"";

  position:absolute;

  width:3px;
  height:6px;

  background:var(--orange);

  border-radius:2px;

  top:4px;
  left:50%;

  transform:translateX(-50%);

  animation:scrollMove 1.5s infinite;
}

@keyframes scrollMove{

  0%{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  100%{
    opacity:0;
    transform:translateX(-50%) translateY(8px);
  }
}

/* ANIMATIONS */

@keyframes fadeUp{

  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes titleReveal{

  0%{
    opacity:0;
    transform:
    scale(.92)
    translateY(20px);
  }

  70%{
    transform:scale(1.02);
  }

  100%{
    opacity:1;
    transform:scale(1);
  }
}

</style>
</head>

<body>

<!-- STARS -->

<script>

for(let i=0;i<120;i++){

  let s=document.createElement("div");

  s.className="star";

  let size=Math.random()*2+1;

  s.style.width=size+"px";
  s.style.height=size+"px";

  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";

  s.style.setProperty(
    "--dur",
    (Math.random()*4+2)+"s"
  );

  document.body.appendChild(s);
}

</script>

<!-- FLOATING LIGHTS -->

<script>

const colors=["blue","orangeLight"];

for(let i=0;i<45;i++){

  let light=document.createElement("div");

  light.classList.add("light");

  light.classList.add(
    colors[Math.floor(Math.random()*colors.length)]
  );

  let size=Math.random()*5+2;

  light.style.width=size+"px";
  light.style.height=size+"px";

  light.style.left=Math.random()*100+"vw";

  light.style.animationDuration=
  (5+Math.random()*8)+"s";

  light.style.animationDelay=
  Math.random()*5+"s";

  document.body.appendChild(light);
}

</script>

<!-- HERO -->

<section class="hero">

<div class="sun"></div>

<div class="headband">

<div class="line"></div>

<div class="plate">
木ノ葉隠れの里
</div>

<div class="line right"></div>

</div>

<p class="pre">
HIDDEN LEAF BIRTHDAY TRANSMISSION
</p>

<h1 class="title">

HAPPY<br>

<span class="orange">
BIRTHDAY
</span>

</h1>

<p class="jp">
お誕生日おめでとう
</p>

<p class="name">
DRAKSMER AUGUSTIN ⚡
</p>

<p class="tag">
"Certified chaos shinobi of the Hidden Leaf 💀🍥"
</p>

<button class="btn">

<span>
OPEN THE BIRTHDAY SCROLL 🍥
</span>

</button>

<div class="scroll">

<span>Scroll</span>

<div class="mouse"></div>

</div>

</section>

</body>
</html>
