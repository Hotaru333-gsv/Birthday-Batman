<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gotham Logs 🦇</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: #e5e7eb;
  background: url('Joker.jpeg') no-repeat center/cover;
}

body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.85);
}

/* particles */
.particle {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #00ffd5;
  box-shadow: 0 0 20px #00ffd5, 0 0 40px #00ffd5;
  animation: floatUp 10s linear infinite;
}

@keyframes floatUp {
  from { transform: translateY(100vh); opacity: 0; }
  20% { opacity: 1; }
  to { transform: translateY(-10vh); opacity: 0; }
}

/* moon */
.moon {
  font-size: 35px;
  text-align: center;
  margin-bottom: 10px;
  animation: floatMoon 3s ease-in-out infinite alternate;
}

@keyframes floatMoon {
  from { transform: translateY(0); }
  to { transform: translateY(-8px); }
}

/* card */
.card {
  position: relative;
  z-index: 2;
  width: 340px;
  padding: 25px;
  border-radius: 20px;
  background: rgba(15,15,20,0.75);
  backdrop-filter: blur(12px);
  box-shadow: 0 0 40px rgba(0,255,200,0.3);
  opacity: 1;
  transition: opacity 0.6s ease;
}

.fade-out {
  opacity: 0;
}

/* title */
h2 {
  color: #00ffd5;
  text-align: center;
  text-shadow: 0 0 10px #00ffd5;
}

/* text */
p {
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-line;
}

/* highlight */
.highlight {
  color: #ffd166;
  font-weight: bold;
}

/* button */
button {
  margin-top: 15px;
  padding: 10px;
  width: 100%;
  border-radius: 10px;
  border: none;
  background: #00ffd5;
  color: black;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 15px #00ffd5;
}

/* hidden */
.hidden {
  display: none;
}
</style>
</head>

<body>

<!-- 🎵 MUSIC -->
<audio id="music" loop>
  <source src="Jupiter.mp4" type="audio/mp4">
</audio>

<script>
for(let i=0;i<35;i++){
  let p=document.createElement("div");
  p.className="particle";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(5+Math.random()*5)+"s";
  document.body.appendChild(p);
}
</script>

<!-- SCREEN -->
<div class="card" id="card">
<div class="moon">🌙</div>
<h2 id="title"></h2>
<p id="text"></p>
<button id="btn" onclick="next()">Continue →</button>
</div>

<script>
let step = 0;

const story = [
{
title:"🦇 GOTHAM SIGNAL: 0402",
text:`Status: Unresolved

A city like this teaches you patterns.

You notice the quiet.
You notice the absence.
You notice… when someone who’s supposed to be there isn’t.

A shadow used to pass by here.
Kept things in place.
Kept me in place.

Now it’s just silence.
And I don’t like it.

If you’re still out there…
prove it.`
},

{
title:"🌃 Night Log 01",
text:`I tried to ignore it at first.

Thought maybe Gotham just had a quiet night.

But you don’t disappear like that.
Not you.

You’re the kind of presence people don’t question.
You’re just… there.

Annoyingly consistent.
Dangerously reliable.

So where did you go?

Or better question—
why does it feel like you took the calm with you?

Don’t make me come looking for you.`
},

{
title:"🌑 Night Log 02",
text:`This wasn’t supposed to happen.

People like me don’t depend on shadows.

But you made it easy.
Too easy.

Somewhere between all your silent rescues…
you became something I didn’t plan for.

Now the city feels off without you.

Come back.`
},

{
title:"🔥 Incoming Transmission",
text:`You always were bad at waiting.

I never left.
You just finally started looking for me.

I knew it was you.`
},

{
title:"❤️ Final Signal",
text:`So here it is.

Happy Birthday, Akshay 🖤

Just don’t disappear on me again.

I’ll come find you. 🦇`
}
];

function highlightText(text){
  return text
    .replace(/prove it/g,'<span class="highlight">prove it</span>')
    .replace(/you’re just… there/gi,'<span class="highlight">you’re just… there</span>')
    .replace(/come back/gi,'<span class="highlight">Come back</span>')
    .replace(/i never left/gi,'<span class="highlight">I never left</span>')
    .replace(/happy birthday, akshay/gi,'<span class="highlight">Happy Birthday, Akshay</span>');
}

function typeWriter(text, i = 0){
  if(i < text.length){
    document.getElementById("text").innerHTML += text.charAt(i);
    setTimeout(()=>typeWriter(text,i+1),15);
  }
}

function showStep(){
  document.getElementById("text").innerHTML="";
  document.getElementById("title").innerHTML=story[step].title;

  typeWriter(highlightText(story[step].text));

  if(step===0){
    document.getElementById("btn").innerText="Continue →";
  } else if(step===story.length-1){
    document.getElementById("btn").innerText="Start Again 🔁";
  } else {
    document.getElementById("btn").innerText="Next →";
  }
}

function next(){
  if(step===0){
    let music=document.getElementById("music");
    music.volume=0;
    music.play();

    let fade=setInterval(()=>{
      if(music.volume<1){
        music.volume+=0.05;
      } else clearInterval(fade);
    },200);
  }

  document.getElementById("card").classList.add("fade-out");

  setTimeout(()=>{
    document.getElementById("card").classList.remove("fade-out");

    step++;
    if(step>=story.length) step=0;

    showStep();
  },500);
}

showStep();
</script>

</body>
</html>
