<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gotham Logs 🦇</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: 'Orbitron', monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: #e5e7eb;
  background: url('Joker.jpeg') no-repeat center/cover;
}

body::before {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.85);
}

/* particles */
.particle {
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#00ffd5;
  box-shadow:0 0 20px #00ffd5,0 0 40px #00ffd5;
  animation:floatUp 10s linear infinite;
}

@keyframes floatUp {
  from{transform:translateY(100vh);opacity:0;}
  20%{opacity:1;}
  to{transform:translateY(-10vh);opacity:0;}
}

/* moon */
.moon {
  font-size:35px;
  text-align:center;
  margin-bottom:10px;
  animation:floatMoon 3s ease-in-out infinite alternate;
}

@keyframes floatMoon {
  from{transform:translateY(0);}
  to{transform:translateY(-8px);}
}

/* card */
.card {
  position:relative;
  z-index:2;
  width:360px;
  padding:25px;
  border-radius:20px;
  background:rgba(15,15,20,0.75);
  backdrop-filter:blur(12px);
  box-shadow:0 0 50px rgba(0,255,200,0.4);
  transition:opacity 0.6s;
}

/* glitch */
.glitch {
  animation: glitch 0.3s infinite;
}

@keyframes glitch {
  0%{transform:translate(0);}
  20%{transform:translate(-2px,2px);}
  40%{transform:translate(2px,-2px);}
  60%{transform:translate(-2px,0);}
  80%{transform:translate(2px,2px);}
  100%{transform:translate(0);}
}

h2 {
  color:#00ffd5;
  text-align:center;
  text-shadow:0 0 12px #00ffd5;
}

p {
  font-size:15px;
  line-height:1.8;
  letter-spacing:0.5px;
  white-space:pre-line;
}

/* highlights */
.yellow{color:#ffd166;font-weight:bold;text-shadow:0 0 8px #ffd166;}
.cyan{color:#00ffd5;font-weight:bold;text-shadow:0 0 8px #00ffd5;}
.pink{color:#ff4d6d;font-weight:bold;text-shadow:0 0 8px #ff4d6d;}

/* button */
button{
  margin-top:15px;
  padding:10px;
  width:100%;
  border-radius:10px;
  border:none;
  background:#00ffd5;
  color:black;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 15px #00ffd5;
}

/* cursor */
.cursor {
  display:inline-block;
  width:8px;
  background:#00ffd5;
  animation:blink 1s infinite;
}

@keyframes blink {
  50%{opacity:0;}
}
</style>
</head>

<body>

<!-- music -->
<audio id="music" loop>
  <source src="Jupiter.mp4" type="audio/mp4">
</audio>

<!-- typing sound -->
<audio id="typeSound">
  <source src="https://www.soundjay.com/mechanical/keyboard-1.mp3">
</audio>

<script>
for(let i=0;i<35;i++){
  let p=document.createElement("div");
  p.className="particle";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(5+Math.random()*5)+"s";
  document.body.appendChild(p);
}
</script>

<div class="card" id="card">
<div class="moon">🌙</div>
<h2 id="title"></h2>
<p id="text"></p>
<button onclick="next()" id="btn">Continue →</button>
</div>

<script>
let step=0;

const story=[
{
title:"🦇 GOTHAM SIGNAL: 0402",
text:`Status: Unresolved

A city like this teaches you patterns.

You notice the quiet.
You notice the absence.
You notice… when someone who’s supposed to be there isn’t.

A shadow used to pass by here.
Kept things in place.
Kept me in place.

Now it’s just silence.
And I don’t like it.

If you’re still out there…
prove it.`
},
{
title:"🌃 Night Log 01",
text:`I tried to ignore it at first.

Thought maybe Gotham just had a quiet night.

But you don’t disappear like that.
Not you.

You’re the kind of presence people don’t question.
You’re just… there.

Annoyingly consistent.
Dangerously reliable.

So where did you go?

Or better question—
why does it feel like you took the calm with you?

Don’t make me come looking for you.`
},
{
title:"🌑 Night Log 02",
text:`This wasn’t supposed to happen.

People like me don’t depend on shadows.

But you made it easy.
Too easy.

Somewhere between all your silent rescues…
you became something I didn’t plan for.

And now?

Now the city feels off without you.
Too loud.
Too empty.

So I’ll say it once.
Only once.

Come back.`
},
{
title:"🔥 Incoming Transmission",
text:`You always were bad at waiting.

I never left.
You just finally started looking for me.

Gotham still needs me.
But lately…

I’ve noticed something else does too.

You call it coincidence.
I call it timing.

And for the record—

I knew it was you the moment the signal felt… different.

You weren’t lost.
You just didn’t realize you were being watched.`
},
{
title:"❤️ Final Signal",
text:`So here it is.

No more shadows.
No more distance.

Happy Birthday, Akshay 🖤

Yeah… I knew it was you all along too.

You act like you’re the one watching over everything.

But here’s the truth—

even you let someone in.

And somehow…
that someone became me.

I’ll come find you. 🦇`
}
];

function highlight(text){
  return text
  .replace(/quiet/g,'<span class="yellow">quiet</span>')
  .replace(/absence/g,'<span class="yellow">absence</span>')
  .replace(/isn’t/g,'<span class="pink">isn’t</span>')
  .replace(/Kept things in place/g,'<span class="cyan">Kept things in place</span>')
  .replace(/Come back/g,'<span class="pink">Come back</span>')
  .replace(/I never left/g,'<span class="cyan">I never left</span>')
  .replace(/Happy Birthday, Akshay/g,'<span class="yellow">Happy Birthday, Akshay</span>');
}

/* typing */
function typeHTML(html, el){
  let i=0, tag="", writingTag=false;

  function type(){
    if(i<html.length){
      let char=html[i];

      if(char=="<") writingTag=true;

      if(writingTag){
        tag+=char;
      } else {
        el.innerHTML+=char;
        document.getElementById("typeSound").play();
      }

      if(char==">"){
        writingTag=false;
        el.innerHTML+=tag;
        tag="";
      }

      i++;
      setTimeout(type,12);
    }
  }
  type();
}

function show(){
  document.getElementById("text").innerHTML="";
  document.getElementById("title").innerText=story[step].title;

  typeHTML(highlight(story[step].text),document.getElementById("text"));

  if(step===story.length-1){
    document.getElementById("btn").innerText="Start Again 🔁";
  } else {
    document.getElementById("btn").innerText="Next →";
  }
}

function next(){
  if(step===0){
    let music=document.getElementById("music");
    music.volume=0;
    music.play();

    let fade=setInterval(()=>{
      if(music.volume<1){
        music.volume+=0.05;
      } else clearInterval(fade);
    },200);
  }

  document.getElementById("card").classList.add("glitch");

  setTimeout(()=>{
    document.getElementById("card").classList.remove("glitch");
    step++;
    if(step>=story.length) step=0;
    show();
  },300);
}

show();
</script>

</body>
</html>
