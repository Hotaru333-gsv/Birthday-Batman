<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Akshay 🦇</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;

  /* Gotham skyline background */
  background: url('https://images.unsplash.com/photo-1496588152823-e2d3ffb6e4a9') no-repeat center/cover;
}

/* Dark overlay */
body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.75);
  z-index: 0;
}

/* Glow effect card */
.card {
  position: relative;
  z-index: 2;
  background: rgba(10,10,10,0.85);
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  width: 360px;

  /* Neon glow */
  box-shadow: 0 0 20px #ffdd00,
              0 0 40px #ffdd00,
              0 0 60px rgba(255,221,0,0.5);
}

/* Batman icon */
.logo {
  font-size: 60px;
  color: #ffdd00;
  text-shadow: 0 0 15px #ffdd00;
}

/* Title */
h1 {
  color: #ffdd00;
  text-shadow: 0 0 10px #ffdd00;
}

/* Text */
p {
  color: #ddd;
  line-height: 1.6;
}

/* Buttons */
button {
  margin: 10px;
  padding: 12px 20px;
  border-radius: 25px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.yes {
  background: #ffdd00;
  color: black;
  box-shadow: 0 0 15px #ffdd00;
}

.no {
  background: transparent;
  border: 1px solid gray;
  color: gray;
  position: absolute;
}

/* Flying bats */
.bat {
  position: absolute;
  font-size: 22px;
  animation: fly 12s linear infinite;
}

@keyframes fly {
  0% { transform: translateX(-100px) translateY(0); }
  100% { transform: translateX(120vw) translateY(-200px); }
}
</style>
</head>

<body>

<!-- 🎵 Birthday Music (user click required for browser) -->
<audio id="music" loop>
  <source src="https://www2.cs.uic.edu/~i101/SoundFiles/HappyBirthday.mid" type="audio/midi">
</audio>

<!-- 🦇 Bats -->
<div class="bat" style="top:10%">🦇</div>
<div class="bat" style="top:40%; animation-duration:10s;">🦇</div>
<div class="bat" style="top:70%; animation-duration:8s;">🦇</div>

<!-- 🎂 Card -->
<div class="card">
  <div class="logo">🦇</div>

  <h1>Happy Birthday Akshay 🖤</h1>

  <p>
    High above Gotham,<br>
    a legend watches the city 🦇<br><br>
    Today, that legend is YOU.<br>
    Stay fearless. Stay unstoppable.
  </p>

  <button class="yes" onclick="playMusic()">
    Turn On Bat Signal 🎵
  </button>

  <button class="no" id="noBtn">
    No 😔
  </button>
</div>

<script>
function playMusic() {
  document.getElementById("music").play();
  alert("Happy Birthday Akshay 🎉");
}

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {
  noBtn.style.top = Math.random() * 300 + "px";
  noBtn.style.left = Math.random() * 300 + "px";
});
</script>

</body>
</html>
