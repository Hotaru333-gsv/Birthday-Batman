<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Batman Cinematic 🦇</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;

  background: url('Joker.jpeg') no-repeat center/cover;
}

/* overlay */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.7);
}

/* particles */
.particle {
  position: absolute;
  width: 6px;
  height: 6px;
  background: #00ffd5;
  border-radius: 50%;
  box-shadow: 0 0 15px #00ffd5;
  animation: float 10s linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

/* card */
.card {
  position: relative;
  z-index: 2;
  width: 320px;
  padding: 30px;
  border-radius: 25px;
  text-align: center;

  background: rgba(15,15,20,0.75);
  backdrop-filter: blur(15px);

  box-shadow: 0 0 40px rgba(0,255,200,0.3);
  opacity: 1;
  transition: opacity 0.6s ease;
}

.fade-out {
  opacity: 0;
}

/* floating */
.float {
  font-size: 40px;
  animation: floatY 3s ease-in-out infinite alternate;
}

@keyframes floatY {
  from { transform: translateY(0); }
  to { transform: translateY(-10px); }
}

/* button */
button {
  margin-top: 20px;
  padding: 12px 25px;
  border-radius: 25px;
  border: none;
  background: #00ffd5;
  color: black;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 20px #00ffd5;
}

/* hidden */
.hidden {
  display: none;
}

/* typing */
#typing {
  white-space: pre-line;
  font-size: 14px;
  line-height: 1.6;
}

/* bat signal */
#signal {
  position: absolute;
  top: 20%;
  font-size: 80px;
  display: none;
  animation: glow 1s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #fff; }
  to { text-shadow: 0 0 40px #ffdd00; }
}
</style>
</head>

<body>

<audio id="music">
  <source src="happy-birthday.mp3" type="audio/mpeg">
</audio>

<div id="signal">🦇</div>

<script>
for(let i=0;i<25;i++){
  let p=document.createElement("div");
  p.className="particle";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(5+Math.random()*5)+"s";
  document.body.appendChild(p);
}
</script>

<!-- SCREEN 1 -->
<div class="card" id="screen1">
  <div class="float">🌙</div>
  <h2>Message from the Shadows</h2>

  <div id="typing"></div>

  <button onclick="start()">Continue</button>
</div>

<!-- SCREEN 2 -->
<div class="card hidden" id="screen2">
  <div class="float">💜</div>
  <h2>Mystery Solved</h2>

  <p>
  You kept looking for clues…<br><br>
  But the truth is—<br>
  this was never a mystery.<br><br>
  <b>It was always you.</b><br><br>
  Happy Birthday, Akshay 🖤
  </p>

  <button onclick="showRiddle()">Final Challenge</button>
</div>

<!-- SCREEN 3 -->
<div class="card hidden" id="screen3">
  <h2>🦇 Final Riddle</h2>

  <p>
  I appear in the sky when danger is near,<br>
  calling a hero Gotham holds dear.<br><br>
  Who am I?
  </p>

  <input id="answer" placeholder="Type answer...">
  <button onclick="check()">Submit</button>

  <p id="result"></p>
</div>

<script>
const text = `🕶️ CLASSIFIED FILE

Subject: Akshay
Status: Under Observation

Gotham has found its hero…
But tonight, the city whispers something more.

"Sometimes it's not who we are underneath,
but what we do that defines us."

And what you do… makes my world better every day.

Happy Birthday, Detective. 🦇`;

let i=0;

function typeWriter(){
  if(i < text.length){
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeWriter,20);
  }
}

typeWriter();

function start(){
  document.getElementById("music").play();

  document.getElementById("signal").style.display="block";

  setTimeout(()=>{
    document.getElementById("signal").style.display="none";
    switchScreen("screen1","screen2");
  },2000);
}

function showRiddle(){
  switchScreen("screen2","screen3");
}

function switchScreen(hide,show){
  document.getElementById(hide).classList.add("fade-out");
  setTimeout(()=>{
    document.getElementById(hide).classList.add("hidden");
    document.getElementById(show).classList.remove("hidden");
  },500);
}

function check(){
  let ans=document.getElementById("answer").value.toLowerCase();
  if(ans.includes("signal")){
    document.getElementById("result").innerHTML =
    "🎉 Correct! Happy Birthday Senpai 🦇💖";
  } else {
    document.getElementById("result").innerHTML =
    "❌ Try again...";
  }
}
</script>

</body>
</html>
