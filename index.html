<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Akshay 🦇</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;

  /* 🌆 OUTSIDE BACKGROUND */
  background: url('gotham.jpg') no-repeat center/cover;
}

/* Dark overlay */
body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 0;
}

/* 🟡 Card */
.card {
  position: relative;
  z-index: 2;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  width: 360px;

  /* 🖼️ INSIDE BACKGROUND */
  background: url('batman.jpg') no-repeat center/cover;

  /* Glow */
  box-shadow: 0 0 20px #ffdd00,
              0 0 40px #ffdd00,
              0 0 60px rgba(255,221,0,0.6);
}

/* Inner dark overlay */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
  border-radius: 20px;
  z-index: -1;
}

/* Title */
h1 {
  color: #ffdd00;
  text-shadow: 0 0 10px #ffdd00;
}

/* Text */
p {
  color: #ddd;
}

/* Button */
button {
  margin-top: 15px;
  padding: 12px 20px;
  border-radius: 25px;
  border: none;
  background: #ffdd00;
  color: black;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 15px #ffdd00;
}

/* Message */
#message {
  margin-top: 20px;
  display: none;
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<!-- 🎵 REAL WORKING MUSIC -->
<audio id="music">
  <source src="happy-birthday.mp3" type="audio/mpeg">
</audio>

<div class="card">

  <h1>Happy Birthday Akshay 🖤</h1>

  <p>
    High above Gotham,<br>
    a legend watches the city 🦇
  </p>

  <button onclick="playMusic()">
    Turn On Bat Signal 🎵
  </button>

  <div id="message">
    🎉 Happy Birthday Akshay! 🎉<br><br>
    May your life be fearless,<br>
    powerful, and unstoppable 🦇✨
  </div>

</div>

<script>
function playMusic() {
  let music = document.getElementById("music");
  music.play();
  document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
